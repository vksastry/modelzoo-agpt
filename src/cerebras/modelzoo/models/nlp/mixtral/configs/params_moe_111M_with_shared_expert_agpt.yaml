runconfig:
  hf_cache_dir: /software/cerebras/dataset/AuroraGpt/hf_cache
  mount_dirs:
  - /software/cerebras/dataset/AuroraGpt
trainer:
  fit:
    train_dataloader:
      batch_size: 192
      data_root: /software/cerebras/dataset/AuroraGpt/full_olmo_mix_data
      data_processor: HuggingFaceIterableDataProcessorOlmoMix 
      subsets: all
      #files_per_subset: 2
      use_weighted_files: true
      weighted_file_list: /home/vsastry/CS3_system/Cerebras_Training_agpt/modelzoo/src/cerebras/modelzoo/models/nlp/gpt3/configs/dolmino-mix-1124-fused-file-list.txt
      sampling_seed: 0
      loop_files: true
      debug_log_first_n: 5
      debug_text_words: 10
      split: train
      sequence_length: 8192
      tokenizer_name: /software/cerebras/dataset/AuroraGpt/tokenizers/gemma-7b/
      # 150 steps x 192 = 28800 sequences of 8192 tokens. max_samples caps the
      # number of raw documents taken before group_texts packs them into
      # sequences, so it must stay well above the sequence count. Left at 400000
      # to keep the tokenizer cache shared with the 400-step run.
      # NOTE: this flag is inverted relative to its name. With use_weighted_files
      # the dataset is an IterableDataset, and the only thing that converts it to
      # a concrete Dataset is gated behind `if streaming:`
      # (HuggingFace_OlmoMix.py:399-401). streaming: False SKIPS that conversion
      # and leaves tokenization running lazily on every batch, forever.
      #
      # streaming: True materializes max_samples documents into an Arrow table at
      # startup, then tokenizes and repacks them eagerly before step 1.
      # Measured 2026-08-29 over 150 steps:
      #   False -> 28.0 samples/sec at steps 30-110, decaying to 25.2 by 150
      #   True  -> 48.4-49.8 samples/sec, flat across all 150 steps
      # 1.7x faster with the decay eliminated, and above the 40.4 compile
      # estimate. Startup cost is ~3 min to materialize; it did NOT OOM at
      # max_samples: 400000, since .take() slices rather than reading every file.
      streaming: True
      cache_dir: /home/vsastry/CS3_system/Cerebras_Training_agpt/modelzoo/src/cerebras/modelzoo/models/nlp/gpt3 #/software/cerebras/dataset/AuroraGpt/data/olmomix_wiki_local/
      # Inert in this config, harmless. The only place num_workers becomes
      # num_proc is the `not streaming and isinstance(dataset, Dataset)` branch
      # (HuggingFace_OlmoMix.py:420), which is unreachable here: streaming:False
      # is what prevents the Dataset conversion, and streaming:True fails the
      # `not streaming` test. Startup tokenization is single-process either way.
      # Measured no effect: 28.3 samples/sec at 8 vs 30.4 at 0.
      num_workers: 8
      persistent_workers: true
      prefetch_factor: 10
      # repeat: true
      shuffle: false
      shuffle_seed: 1
    val_dataloader: &val_dataloader
      batch_size: 95
      data_dir: /software/cerebras/dataset/gptj/train_8M_msl2048/ 
      data_processor: GptHDF5MapDataProcessor 
      persistent_workers: true
      prefetch_factor: 10
      shuffle: false
      shuffle_seed: 1
      use_worker_cache: false
  init: &init
    backend:
      backend_type: CSX
      cluster_config:
        max_wgt_servers: 24
        num_workers_per_csx: 1
        # Tried max_act_per_csx: 83 to match the "can only saturate 83 WIOs"
        # warning. It backfired: WIO allocation went 96 -> 103 and activation
        # pods 24 -> 52, with throughput unchanged at ~28 samples/sec. The
        # warning is descriptive of the rack wiring, not a knob to match.
        # Left unset (0 = cluster-chosen default).
    checkpoint:
      # Throughput probe: never checkpoint, it is pure wall-clock cost.
      save_initial_checkpoint: false
      steps: 100000
    logging:
      log_level: INFO
      log_steps: 10
    callbacks:
    # Pin the micro batch size. Left unset it defaults to "auto", which makes
    # the compiler search grad-accum candidates (6/12/24/32/48/64/96...) and
    # costs ~25 min of compile per attempt. 96 divides the 192 global batch.
    - ScopedTrainFlags:
        csx.performance.micro_batch_size: 96
    # val_dataloader batch_size is 95, and micro_batch_size must be <= it.
    - ScopedValidateFlags:
        csx.performance.micro_batch_size: 95
    loop:
      # num_steps takes precedence over max_steps and the two are mutually
      # exclusive, so max_steps/eval_steps are removed rather than overridden.
      # 150 steps. The 400-step run showed Rate converges by step 30 and holds
      # ~28 samples/sec, so 150 is enough to read steady state plus margin for
      # the dip seen around steps 120-140.
      num_steps: 150
      # Disable validation during fit. `cszoo fit` runs mode=train_and_eval,
      # which calls _validate_all after every train loop; a null eval_frequency
      # is the documented way to turn that off (run_schedule.py:490). Without
      # this, eval on the 8M-sample HDF5 set costs ~28 min of the ~87 min run.
      eval_frequency: null
    model: &base_model
      name: mixtral
      attention_dropout_rate: 0.0
      attention_softmax_fp32: true
      attention_type: scaled_dot_product
      dropout_rate: 0.0
      embedding_dropout_rate: 0.0
      embedding_initializer:
        a: -0.1734
        b: 0.1734
        mean: 0.0
        name: truncated_normal
        std: 0.0867
      embeddings_scale: 9.1706
      filter_size: 2048
      hidden_size: 768
      initializer:
        a: -0.10011253667748111
        b: 0.10011253667748111
        mean: 0.0
        name: truncated_normal
        std: 0.05005626833874056
      layer_norm_epsilon: 1.0e-05
      max_position_embeddings: 131072 
      moe:
        num_shared_experts: 2
        load_balancing_loss_coef: 0.01
        null_expert_bias: 1.1
        num_experts: 8
        router_fp32: true
        routing_algorithm: learned
        top_k: 1
      nonlinearity: swiglu
      num_heads: 12
      num_hidden_layers: 10
      output_layer_initializer:
        a: -0.02238584374107887
        b: 0.02238584374107887
        mean: 0.0
        name: truncated_normal
        std: 0.011192921870539435
      output_logits_scale: 0.3651
      position_embedding_type: alibi
      scale_qk_dot_by_d: true
      share_embedding_weights: true
      use_bias_in_output: false
      use_ffn_bias: true
      use_ffn_bias_in_attention: true
      use_projection_bias_in_attention: true
      vocab_size: 256000 
    optimizer: &base_optimizer
      AdamW:
        adjust_learning_rate:
          decoder_kernel: 0.3333333333333333
        betas:
        - 0.9
        - 0.95
        correct_bias: true
        eps: 1.0e-08
        weight_decay: 0.1
    precision: &base_precision
      enabled: true
      fp16_type: bfloat16
      log_loss_scale: true
      loss_scaling_factor: dynamic
      max_gradient_norm: 1.0
      precision_opt_level: 0
    schedulers: &base_schedulers
    - ScalePerParamLR:
        scheduler:
          SequentialLR:
            schedulers:
            - LinearLR:
                end_learning_rate: 0.015625
                initial_learning_rate: 0.0
                total_iters: 953
            - LinearLR:
                end_learning_rate: 0.0
                initial_learning_rate: 0.015625
                total_iters: 4610
    seed: 1
  validate:
    val_dataloader: *val_dataloader
  validate_all:
    val_dataloaders: *val_dataloader
